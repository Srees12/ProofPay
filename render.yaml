services:
  - type: web
    name: proofpay-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SENTINEL_APP_NAME
        value: ProofPay
      - key: SENTINEL_CORS_ORIGINS
        sync: false

  - type: web
    name: proofpay-console
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
